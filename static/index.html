<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperShelf</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2e7d55">
<meta name="application-name" content="PaperShelf">
<meta name="apple-mobile-web-app-title" content="PaperShelf">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="menu-wrap brand-wrap">
      <button class="brand" id="brand-btn" type="button" title="PaperShelf menu"><img src="/static/icons/icon-64.png" alt="" width="26" height="26">PaperShelf<svg class="brand-car" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="menu brand-menu" id="brand-menu"></div>
    </div>
    <div id="tabs" class="navtabs">
    <div class="nt-read-group">
      <button data-tab="reading" class="nt nt-read on" title="Your reading list: the papers to read and being read"><svg class="nt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.2 5 7.6 4.5 4 4.8v13.4c3.6-.3 6.2.2 8 1.7 1.8-1.5 4.4-2 8-1.7V4.8c-3.6-.3-6.2.2-8 1.7zM12 6.5v13.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Reading list</span><span class="tab-n" id="tab-reading-n"></span></button>
    <form id="add-form" class="tab-library-only" autocomplete="off">
      <span class="add-plus" aria-hidden="true">＋</span>
      <input id="add-input" class="input" placeholder="Add a paper: DOI, link or title…  ( n )">
      <button class="btn primary" id="add-btn" type="submit">Add</button>
      <div class="menu-wrap">
        <button class="btn icon" type="button" id="more-btn" title="More ways to add">⋯</button>
        <div class="menu" id="more-menu">
          <button type="button" data-menu="bulk">Add many at once…<small>One link / DOI / title per line</small></button>
          <button type="button" data-menu="import">Import PDF files…<small>Or drag PDFs onto the window</small></button>
          <button type="button" data-menu="manual">Add manually<small>Type the details yourself</small></button>
        </div>
      </div>
    </form>
    </div>
    <div class="grow"></div>
    <div class="nt-tools" role="tablist">
      <button data-tab="library" class="nt" title="All your papers, read ones included – with map, review tables, Discover, statistics and exports"><svg class="nt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5h3.2v15H4.5zM9.6 4.5h3.2v15H9.6zM14.6 5.6l3.1-.8 3.8 14.5-3.1.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4.5 8h3.2M9.6 8h3.2M4.5 16h3.2M9.6 16h3.2" stroke="currentColor" stroke-width="1.4"/></svg><span>Library</span></button>
      <button data-tab="people" class="nt" title="Researcher profiles: publications, citations, h-index"><svg class="nt-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 19.5c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M15.6 5.6a3 3 0 0 1 0 5.8M17.6 14.4c1.8.6 3 2.3 3.4 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Researchers</span></button>
    </div>
    </div>
    <span class="hdr-sep" aria-hidden="true"></span>
    <button class="btn small update-btn" id="update-btn" style="display:none">⬆ Update</button>
    <button class="btn icon round feed-btn" id="feed-btn" type="button" title="What's new"><svg class="hb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 1.8H4.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="feed-n" id="feed-n"></span></button>
    <button class="btn icon round" id="sync-btn" title="Update now"><svg class="sync-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 6.3A5.4 5.4 0 0 0 3.4 4.9M2.8 9.7a5.4 5.4 0 0 0 9.8 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.6 2.6v3.9H9.7M2.4 13.4V9.5h3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn icon round" data-help="start" title="Guide and help"><span class="hb-q">?</span></button>
    <button class="btn icon round" id="settings-btn" title="Settings"><svg class="hb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  </header>

  <aside id="people-side" class="tab-people-only"></aside>
  <main id="people-main" class="tab-people-only"></main>

  <div id="side-hot"></div>
  <button class="btn icon side-toggle tab-people-only" id="people-side-toggle" type="button" title="Researchers list"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <aside id="sidebar" class="tab-library-only">
    <div class="side-head"><span id="nav-head">Reading list</span><button id="side-pin" class="side-pin-btn" data-sidepin type="button" title="Keep the sidebar open"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1.8h4l-.6 4 2.6 2.4v1.2H8.6V14L8 14.8 7.4 14V9.4H4V8.2l2.6-2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button></div>
    <div id="nav"></div>
    <div class="side-head" id="labels-head"><span class="sec-toggle" data-sec="labels"></span><button id="new-group" type="button" title="New label">＋</button></div>
    <div id="labels-body"><div id="tree"></div></div>
    <div class="side-head" id="shares-head"><span class="sec-toggle" data-sec="shared"></span><button id="new-share" type="button" title="New group, or join one">＋</button></div>
    <div id="groups-body"><div id="sharelist"></div></div>
    <div class="side-head" id="kw-head">Keywords</div>
    <div id="kwcloud"></div>
  </aside>

  <main class="tab-library-only">
    <div class="view-head">
      <div class="vh-left"><button class="btn icon side-toggle" id="side-toggle" type="button" title="Show labels and lists (or move the mouse to the left edge)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><div>
        <h1 id="view-title">All papers</h1>
        <div class="sub" id="view-sub"></div></div>
      </div>
      <div class="head-right">
        <div class="filters" id="filters"></div>
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="Search titles, notes, PDFs…" title="Searches titles, authors, journals, keywords, abstracts, notes – and the text inside your PDFs"><kbd>/</kbd></label>
        <div class="seg mode-seg" id="mode-seg" role="tablist">
          <button data-mode="list" class="on" title="List of papers">☰<span class="ml"> List</span></button>
          <button data-mode="map" title="Citation map of these papers">🕸<span class="ml"> Map</span></button>
          <button data-mode="table" title="Review table of a label: one row per paper, your own columns (aim, method, result…)">▦<span class="ml"> Table</span></button>
          <button data-mode="discover" title="Suggested papers related to these">💡<span class="ml"> Discover</span></button>
        </div>
      </div>
    </div>
    <div class="toolbar" id="list-toolbar">
      <label class="sel-all" title="Select all the papers shown"><input type="checkbox" id="select-all"></label>
      <span class="count-label" id="count-label">0 papers</span>
      <div id="bulk">
        <select id="bulk-group"><option value="">Add label…</option></select>
        <select id="bulk-share"><option value="">Share…</option></select>
        <button class="btn small" id="bulk-remove" style="display:none">Remove this label</button>
        <select id="bulk-status"><option value="">Set status…</option><option value="to_read">To read</option><option value="reading">Reading</option><option value="read">Read</option></select>
        <button class="btn small" id="bulk-pdf">⬇ Find PDFs</button>
        <button class="btn small" id="bulk-notes" title="Download the notes of the selected papers, each with its reference">📝 Export notes</button>
        <button class="btn small danger" id="bulk-delete">Delete</button>
      </div>
      <div class="grow"></div>
      <label class="check" id="incl-sub-wrap" style="display:none"><input type="checkbox" id="incl-sub"> include sub-labels</label>
      <div class="view-opts">
        <label class="vo" title="Show the papers as one list, or grouped by label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><select id="arr-sel"><option value="list">No grouping</option><option value="each">By label</option><option value="combo">By label combination</option></select></label>
        <label class="vo" title="Sort"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><select id="sort"></select></label>
        <label class="vo vo-toggle" title="Show keywords and more under each paper"><input type="checkbox" id="details-toggle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 11h10M4 16h16M4 20.5h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Details</span></label>
      </div>
      <button class="btn small vo-export" id="export-btn" title="Export references (APA, Nature… / Zotero / BibTeX) or notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Export</span></button>
    </div>
    <div id="list"></div>
    <div id="map-view" class="mode-view"></div>
    <div id="discover-view" class="mode-view"></div>
    <div id="review-view" class="mode-view"></div>
  </main>
</div>

<section id="detail" aria-label="Paper details">
  <div class="d-top"><span class="saved" id="saved">✓ Saved</span><button class="btn small" id="close-detail">Close ✕</button></div>
  <div id="detail-body"></div>
</section>

<section id="reader" aria-label="PDF reader"></section>
<section id="help" aria-label="Guide"></section>

<input type="file" id="attach-input" accept="application/pdf,.pdf" hidden>
<input type="file" id="import-input" accept="application/pdf,.pdf" multiple hidden>
<div id="toasts"></div>
<div id="drop-overlay">Drop PDF files to add them to your library</div>

<script src="/static/app.js"></script>
<script src="/static/graph.js"></script>
<script src="/static/discover.js"></script>
<script src="/static/reader.js"></script>
<script src="/static/people.js"></script>
<script src="/static/help.js"></script>
<script src="/static/update.js"></script>
<script src="/static/suggest.js"></script>
<script src="/static/shares.js"></script>
<script src="/static/notes.js"></script>
<script src="/static/appinstall.js"></script>
<script src="/static/smart.js"></script>
</body>
</html>
